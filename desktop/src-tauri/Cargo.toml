[package]
name = "n38worth-desktop"
version = "1.0.0"
description = "n38worth — The City Building Simulation (Windows client)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "n38worth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
